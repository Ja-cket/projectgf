<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6b1218" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Для Даши</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="world-anchor" id="anchor" aria-hidden="true">
        <div class="world" id="world">
          <div class="glow glow-a"></div>
          <div class="glow glow-b"></div>
          <div class="glow glow-c"></div>
          <div class="glow glow-d"></div>
          <canvas id="field"></canvas>
        </div>
      </div>

      <div class="veil" id="veil" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <main class="stage">
        <section class="intro" id="intro" aria-live="polite">
          <button class="hint-btn" id="tap" type="button">жми</button>
        </section>

        <section class="reveal" id="reveal" hidden>
          <div class="heart-stage" id="heartStage">
            <div class="heart-wrap" id="heartWrap">
              <!-- Anatomical heart, anterior view -->
              <svg
                class="anatomy"
                id="anatomy"
                viewBox="0 0 240 280"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <defs>
                  <linearGradient id="muscle" x1="20%" y1="10%" x2="85%" y2="95%">
                    <stop offset="0%" stop-color="#d4454f" />
                    <stop offset="40%" stop-color="#9e1f2c" />
                    <stop offset="100%" stop-color="#4a0c14" />
                  </linearGradient>
                  <linearGradient id="muscleDeep" x1="10%" y1="0%" x2="80%" y2="100%">
                    <stop offset="0%" stop-color="#b02834" />
                    <stop offset="100%" stop-color="#2e070c" />
                  </linearGradient>
                  <linearGradient id="vessel" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f0c4b8" />
                    <stop offset="100%" stop-color="#a87870" />
                  </linearGradient>
                  <linearGradient id="aortaFill" x1="0%" y1="0%" x2="40%" y2="100%">
                    <stop offset="0%" stop-color="#e0b0a4" />
                    <stop offset="100%" stop-color="#8f6058" />
                  </linearGradient>
                </defs>

                <!-- 1. Superior vena cava -->
                <g class="part" data-part="1">
                  <path
                    class="part__fill"
                    fill="url(#vessel)"
                    d="M156 8h22c7 0 12 5 12 12v52c0 7-5 12-12 12h-18c-7 0-12-5-12-12V24c0-9 4-16 8-16z"
                  />
                  <path
                    class="part__stroke"
                    d="M156 8h22c7 0 12 5 12 12v52c0 7-5 12-12 12h-18c-7 0-12-5-12-12V24c0-9 4-16 8-16z"
                  />
                </g>

                <!-- 2. Aorta + arch + branches -->
                <g class="part" data-part="2">
                  <path
                    class="part__fill"
                    fill="url(#aortaFill)"
                    d="M108 98V78c0-40 22-66 60-70 10-1 18 7 18 17v14c0 6-4 11-10 12-18 3-28 16-28 34v36c0 7-6 13-13 13h-14c-7 0-13-6-13-13V98z"
                  />
                  <path
                    class="part__stroke"
                    d="M108 98V78c0-40 22-66 60-70 10-1 18 7 18 17v14c0 6-4 11-10 12-18 3-28 16-28 34v36c0 7-6 13-13 13h-14c-7 0-13-6-13-13V98z"
                  />
                  <path
                    class="part__fill"
                    fill="url(#aortaFill)"
                    d="M134 22c-1-12 5-20 15-20h10c7 0 11 5 10 12l-4 18c-1 5-6 9-11 9h-8c-7 0-11-8-12-19z"
                  />
                  <path
                    class="part__fill"
                    fill="url(#aortaFill)"
                    d="M156 14c1-10 7-16 16-16h8c7 0 12 5 12 12v16c0 7-5 12-12 12h-8c-9 0-17-8-16-24z"
                  />
                  <path
                    class="part__fill"
                    fill="url(#aortaFill)"
                    d="M176 20c2-8 8-14 16-14h6c6 0 10 5 10 11v10c0 6-4 11-10 11h-8c-8 0-15-6-14-18z"
                  />
                </g>

                <!-- 3. Pulmonary trunk / artery -->
                <g class="part" data-part="3">
                  <path
                    class="part__fill"
                    fill="#c99288"
                    d="M86 90c-2-26 12-46 40-50 8-1 14 5 14 13v12c0 5-3 10-8 11-14 3-22 14-22 28v22c0 6-5 11-11 11h-10c-6 0-11-5-11-11V90z"
                  />
                  <path
                    class="part__stroke"
                    d="M86 90c-2-26 12-46 40-50 8-1 14 5 14 13v12c0 5-3 10-8 11-14 3-22 14-22 28v22c0 6-5 11-11 11h-10c-6 0-11-5-11-11V90z"
                  />
                  <path
                    class="part__fill"
                    fill="#b87e74"
                    d="M78 58c-22 4-36 20-32 38 2 8 9 12 17 10l22-6c6-2 10-8 8-14-3-14 0-24 10-28-6-2-15-2-25 0z"
                  />
                  <path
                    class="part__stroke"
                    d="M78 58c-22 4-36 20-32 38 2 8 9 12 17 10l22-6c6-2 10-8 8-14-3-14 0-24 10-28-6-2-15-2-25 0z"
                  />
                </g>

                <!-- 4. Right atrium (viewer's right / patient's right) -->
                <g class="part" data-part="4">
                  <path
                    class="part__fill"
                    fill="url(#muscleDeep)"
                    d="M168 88c26-2 48 16 50 42 2 32-16 56-46 60-10 2-20-4-23-14l-8-34c-3-12 2-24 12-30 4-3 9-6 15-24z"
                  />
                  <path
                    class="part__stroke"
                    d="M176 96c20 0 38 14 40 34 2 26-12 44-36 48-8 1-15-4-17-11l-7-30c-2-10 2-19 10-24 3-2 6-4 10-17z"
                  />
                </g>

                <!-- 5. Left atrium + pulmonary veins -->
                <g class="part" data-part="5">
                  <path
                    class="part__fill"
                    fill="#70141e"
                    d="M58 108c-24 8-38 34-30 58 6 20 24 34 46 32 12-1 18-12 15-23l-8-30c-2-10-10-17-20-21-1-6-3-12-3-16z"
                  />
                  <path
                    class="part__stroke"
                    d="M62 116c-18 8-28 28-22 46 4 14 18 26 36 24 8-1 13-8 11-15l-7-26c-2-8-8-14-16-17-1-5-2-10-2-12z"
                  />
                  <path class="part__fill" fill="#a87870" d="M36 118c-14-2-24 6-24 16 0 6 5 10 11 10h18c4-10 5-18 2-24-2-1-5-2-7-2z" />
                  <path class="part__fill" fill="#a87870" d="M40 140c-16 0-26 8-26 18 0 6 5 10 11 10h20c3-10 4-18 1-24-2-2-4-4-6-4z" />
                </g>

                <!-- 6. Right ventricle (anterior bulk) -->
                <g class="part" data-part="6">
                  <path
                    class="part__fill"
                    fill="url(#muscle)"
                    d="M128 128c32 2 56 30 54 64-3 40-34 70-70 74-12 2-22-4-26-15-14-28-20-56-10-82 10-26 28-42 52-41z"
                  />
                  <path
                    class="part__stroke"
                    d="M132 136c26 2 46 26 44 52-2 32-28 56-56 60-9 1-16-3-19-11-12-22-16-46-8-68 8-22 22-34 39-33z"
                  />
                </g>

                <!-- 7. Left ventricle + apex (points down-left) -->
                <g class="part" data-part="7">
                  <path
                    class="part__fill"
                    fill="url(#muscleDeep)"
                    d="M112 140c-28 10-50 42-44 78 6 42 42 72 84 66 14-2 20-16 14-28-20-52-24-86-8-108-14-2-30-4-46-8z"
                  />
                  <path
                    class="part__stroke"
                    d="M108 150c-22 10-38 36-34 64 5 32 34 56 66 52 10-1 14-11 10-20-18-44-20-72-6-92-12-1-24-2-36-4z"
                  />
                  <path
                    class="part__fill"
                    fill="#3a080e"
                    d="M122 236c10 22 36 34 54 20 2 10-6 22-20 26-30 10-58-6-62-34 8-6 18-10 28-12z"
                  />
                  <path
                    class="part__stroke"
                    d="M124 240c8 16 28 26 44 16 1 8-4 16-14 20-22 8-44-2-48-24 6-5 12-8 18-12z"
                  />
                </g>

                <!-- 8. Coronary vessels / grooves -->
                <g class="part" data-part="8">
                  <path class="part__stroke part__stroke--thin" d="M124 138c-6 32-2 64 10 96" />
                  <path class="part__stroke part__stroke--thin" d="M118 162c22 6 42 2 58-12" />
                  <path class="part__stroke part__stroke--thin" d="M112 184c26 10 48 6 66-8" />
                  <path class="part__stroke part__stroke--thin" d="M170 152c10 22 8 48-4 70" />
                  <path class="part__stroke part__stroke--thin" d="M96 156c-10 18-8 40 2 58" />
                  <path
                    class="part__fill"
                    fill="#5a1018"
                    opacity="0.5"
                    d="M120 136c3 0 5 2 4 5-5 30-2 60 8 90-5 2-10 1-12-1-10-30-13-62-7-90 1-3 4-4 7-4z"
                  />
                </g>
              </svg>
            </div>
          </div>
          <button class="hint-btn hint-btn--second" id="tap2" type="button" hidden>
            жми
          </button>
        </section>

        <section class="letter" id="letter" hidden>
          <p class="letter__eyebrow">для Даши</p>
          <div class="letter__title-row">
            <h1 class="letter__title">Моё сердце<br />бьётся для тебя</h1>
            <div class="letter__heart-slot" id="heartSlot"></div>
          </div>
          <div class="letter__body">
            <p>
              Когда ты рядом, внутри всё оживает — будто мир становится теплее
              на один удар.
            </p>
            <p>
              Спасибо тебе за улыбку, за свет и за то, что рядом с тобой
              хочется беречь каждый момент.
            </p>
            <p class="letter__sign">Я люблю тебя, Даша.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
